name: Tests

on:
  push:
    tags:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run:verbose

      - name: Notify Google Sheet
        if: always()
        run: |
          response=$(curl -sS -L --post301 --post302 --post303 \
            -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"student\": \"${{ github.actor }}\",
              \"tag\": \"${{ github.ref_name }}\",
              \"status\": \"${{ job.status }}\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Webhook HTTP status: $http_code"
          echo "Webhook response body: $body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Google Sheet webhook failed with status $http_code"
            exit 1
          fi
